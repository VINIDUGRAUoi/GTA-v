name: Build Android APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Preparar projeto
        run: |
          if [ -f project.godot ]; then
            P=.
          else
            unzip -o open-city-android.zip -d src
            P=$(dirname "$(find src -name project.godot | head -n 1)")
          fi
          echo "PROJECT_PATH=$P" >> $GITHUB_ENV
      - name: Instalar templates
        run: |
          if [ "$HOME" != "/root" ]; then
            mkdir -p ~/.local/share/godot ~/.config
            cp -r /root/.local/share/godot/export_templates ~/.local/share/godot/
            cp -r /root/.config/godot ~/.config/ || true
          fi
          ls ~/.local/share/godot/export_templates/
      - name: Configurar Android
        run: |
          SM=$(find / -name sdkmanager -type f 2>/dev/null | head -n 1)
          echo "sdkmanager: $SM"
          SDK=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}
          echo "SDK: $SDK"
          if [ -n "$SM" ]; then
            yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
            "$SM" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null || true
          fi
          if [ ! -e "$SDK/cmdline-tools/latest/bin/sdkmanager" ] && [ -n "$SM" ]; then
            SMDIR=$(dirname "$(dirname "$SM")")
            mkdir -p "$SDK/cmdline-tools"
            ln -sfn "$SMDIR" "$SDK/cmdline-tools/latest"
          fi
          JAVA=$(dirname "$(dirname "$(readlink -f "$(which java)")")")
          echo "JAVA: $JAVA"
          KS=/root/debug.keystore
          if [ ! -f "$KS" ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$KS" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          mkdir -p ~/.config/godot
          F=$(ls ~/.config/godot/editor_settings*.tres 2>/dev/null | head -n 1)
          if [ -z "$F" ]; then
            F=~/.config/godot/editor_settings-4.3.tres
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$F"
          fi
          sed -i '/^export\/android\//d' "$F"
          printf 'export/android/android_sdk_path = "%s"\n' "$SDK" >> "$F"
          printf 'export/android/java_sdk_path = "%s"\n' "$JAVA" >> "$F"
          printf 'export/android/debug_keystore = "%s"\n' "$KS" >> "$F"
          printf 'export/android/debug_keystore_user = "androiddebugkey"\n' >> "$F"
          printf 'export/android/debug_keystore_pass = "android"\n' >> "$F"
          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "JAVA=$JAVA" >> $GITHUB_ENV
      - name: Testes automatizados
        continue-on-error: true
        run: |
          cd "$PROJECT_PATH"
          godot --headless --import || true
          godot --headless --path . -s tests/run_tests.gd
      - name: Exportar APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          cd "$PROJECT_PATH"
          RC=0
          godot --headless --verbose --export-debug "Android" "$GITHUB_WORKSPACE/build/open-city.apk" > /tmp/export.log 2>&1 || RC=$?
          if [ $RC -ne 0 ]; then
            echo "===== DIAGNOSTICO ====="
            check() { if [ -e "$1" ]; then echo "OK    $1"; else echo "FALTA $1"; fi; }
            check "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
            check "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"
            check /root/debug.keystore
            check "$SDK/platform-tools/adb"
            check "$SDK/build-tools/34.0.0/aapt2"
            check "$SDK/platforms/android-34/android.jar"
            check "$SDK/cmdline-tools/latest/bin/sdkmanager"
            check "$JAVA/bin/javac"
            echo "--- SDK:"; ls "$SDK"
            echo "--- build-tools:"; ls "$SDK/build-tools"
            echo "--- platforms:"; ls "$SDK/platforms"
            echo "--- templates:"; ls "$HOME/.local/share/godot/export_templates/"
            echo "--- android_debug.apk encontrados:"; find / -name android_debug.apk 2>/dev/null
            echo "--- preset:"; grep -n "Android\|unique_name" export_presets.cfg
            echo "--- configuracoes do Godot:"; grep "export/android" "$HOME"/.config/godot/editor_settings*.tres
            echo "--- erros do export:"; grep -i -n "error\|erro" /tmp/export.log | cat -v
          fi
          exit $RC
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Open City build ${{ github.run_number }}
          files: build/open-city.apk
          
